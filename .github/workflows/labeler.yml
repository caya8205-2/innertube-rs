name: Label PRs

on:
- pull_request_target

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: srvaroa/labeler@master
      with:
          config_path: .github/labeler_config.yml
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"